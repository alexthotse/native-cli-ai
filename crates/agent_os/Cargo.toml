[package]
name = "agent_os"
version = "0.1.0"
edition = "2021"
description = "Agent OS inspired by OpenFang - Autonomous AI Agent Framework"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }
nca-common = { path = "../common" }
nca-llm = { path = "../llm" }
nca-rag = { path = "../rag" }
