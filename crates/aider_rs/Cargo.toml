[package]
name = "aider_rs"
version = "0.1.0"
edition = "2021"
description = "Rust reimplementation of Aider - AI-powered coding assistant (Claude Code killer)"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
futures = "0.3"
clap = { version = "4", features = ["derive"] }
diffy = "0.4"
colored = "2"
indicatif = "0.17"
anyhow = "1"
walkdir = "2"
tempfile = "3"
nca-common = { path = "../common" }
nca-llm = { path = "../llm" }
nca-rag = { path = "../rag" }
agent_os = { path = "../agent_os" }
rig_core = { path = "../rig_core" }

[[bin]]
name = "aider-rs"
path = "src/main.rs"
