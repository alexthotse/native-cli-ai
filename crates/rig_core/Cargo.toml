[package]
name = "rig_core"
version = "0.1.0"
edition = "2021"
description = "Rust implementation of Rig RLM (Retrieval-Augmented Language Model) framework"
license = "MIT"

[dependencies]
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
async-trait = "0.1"
tracing = "0.1"
uuid = { version = "1", features = ["v4"] }
thiserror = "1"
futures = "0.3"
nca-common = { path = "../common" }
nca-llm = { path = "../llm" }
nca-rag = { path = "../rag" }

[features]
default = []
